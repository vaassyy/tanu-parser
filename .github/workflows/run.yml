name: Daily Parser

on:
  schedule:
    - cron: '0 3 * * *' # Запуск каждый день в 03:00 ночи (по UTC)
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой!

permissions:
  contents: write # Дает скрипту право сохранять файл feed.xml обратно в папку

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем папку
        uses: actions/checkout@v4

      - name: Включаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Устанавливаем библиотеки
        run: pip install requests beautifulsoup4

      - name: Запускаем парсер!
        run: python parser.py

      - name: Сохраняем готовый XML
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add feed.xml
          git commit -m "Авто-обновление прайса" || exit 0
          git push
